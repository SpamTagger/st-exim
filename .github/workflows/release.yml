name: Build and Release Debian Packages

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [trixie, forky]
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-user

      - name: Extract version
        id: version
        run: |
          exim=${GITHUB_REF_NAME#v}

          index_url="https://debs.spamtagger.org/dists/${{ matrix.distro }}/main/binary-${{ matrix.arch }}/Packages"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          status="$(curl -sSL -o "$tmp/Packages" \
            -w '%{http_code}' "$index_url")"

          revision=1
          case "$status" in
            200)
              PKG=""
              while read p; do
                if [[ "$(echo $p | awk '{ print $1 }')" == "Package:" ]]; then
                  PKG=$(echo $p | awk '{ print $2 }')
                fi
                if [[ "$(echo $p | awk '{ print $1 }')" == "Version:" ]] && [[ "$PKG" == "st-exim" ]]; then
                  V=$(echo $p | awk '{ print $2 }')
                  grep -q "-" || continue
                  if [[ ${V#*-} -ge $revision ]]; then
                    revision=${V#*-}
                    let revision=$((revision+1))
                  fi
                fi
              done <$tmp/Packages
              echo "Building revision $revision"
              ;;
            404)
              echo "No published index for ${{ matrix.distro }}/${{ matrix.arch }}; starting at revision 1."
              ;;
            *)
              echo "::error::Failed to retrieve APT index: HTTP ${status}"
              exit 1
              ;;
          esac

          echo "exim=${exim}-${revision}" >> $GITHUB_OUTPUT

      - name: Build package
        run: |
          ./build-and-extract.sh \
            "${{ steps.version.outputs.exim }}" \
            "${{ matrix.distro }}" \
            "${{ matrix.arch }}" \
            dist

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/*.deb

      - name: Upload SHA256SUM
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.distro }}-${{ matrix.arch }}-sha256
          path: dist/*.deb.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract version
        id: version
        run: |
          echo "exim=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Import GPG key
        run: echo "${{ secrets.DEB_GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import

      - name: Create Combined SHA256SUMS
        run: |
          cd artifacts
          find . -name "*.deb" -exec sha256sum {} \; > SHA256SUMS

      - name: Sign SHA256SUMS
        working-directory: artifacts
        run: |
          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "${{ secrets.DEB_GPG_PASSPHRASE }}" \
            --armor --detach-sign SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.deb.sha256
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.asc
          token: ${{ secrets.RELEASE_TOKEN }}
          overwrite_files: true

      - name: Trigger repo update
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEBS_REPO_TRIGGER }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SpamTagger/debs/actions/workflows/publish.yml/dispatches \
                -d '{"ref":"main","inputs":{"trigger-repo":"st-exim","version":"${{ steps.version.outputs.exim }}"}}'
